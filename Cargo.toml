[workspace]
resolver = "3"
members = [
    "crates/shared",
    "crates/server",
    "crates/client",
    "crates/lobby",
    "tools/atlas_gen",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
repository = "https://github.com/heyheyyournotcute3-sudo/deepcore"

[workspace.dependencies]
# --- engine ---------------------------------------------------------------
bevy = { version = "=0.20.1", default-features = false, features = [
    "std",
    "async_executor",
    "bevy_asset",
    "bevy_log",
    "bevy_state",
    "bevy_color",
    "bevy_camera",
    "bevy_image",
    "bevy_light",
    "bevy_mesh",
    "bevy_pbr",
    "bevy_render",
    "bevy_core_pipeline",
    "bevy_anti_alias",
    "bevy_post_process",
    "bevy_shader",
    "bevy_material",
    "bevy_window",
    "bevy_winit",
    "bevy_ui",
    "bevy_ui_render",
    "bevy_text",
    "bevy_gizmos",
    "bevy_gizmos_render",
    "bevy_audio",
    "bevy_picking",
    "multi_threaded",
    "x11",
    "wayland",
    "png",
    "tonemapping_luts",
    "default_font",
    "serialize",
    "reflect_auto_register",
    "smaa_luts",
    "zstd_rust",
] }

# --- networking -----------------------------------------------------------
bevy_replicon = { version = "=0.45.5", default-features = false }
bevy_replicon_renet = { version = "=0.21.0", default-features = false, features = [
    "renet_netcode",
] }

# --- ui -------------------------------------------------------------------
bevy_egui = { version = "=0.43.1", default-features = false, features = ["default_fonts", "render", "bevy_ui"] }

# --- data & misc ----------------------------------------------------------
serde = { version = "1.0", features = ["derive"] }
ron = "0.11"
postcard = { version = "1.1", features = ["alloc"] }
zstd = "0.13"
noise = "0.9"
rand = "0.9"
rand_chacha = "0.9"
tracing = "0.1"
thiserror = "2.0"
hashbrown = "0.15"
clap = { version = "4.5", features = ["derive"] }
anyhow = "1.0"
proptest = "1.6"
image = { version = "0.25", default-features = false, features = ["png"] }

# internal
deepcore_shared = { path = "crates/shared" }

[profile.dev]
opt-level = 1
# Debug info for Bevy's dependency tree is large enough to exhaust memory during linking on
# small machines; line tables are enough for our own code.
debug = 1

[profile.dev.package."*"]
opt-level = 3
debug = false

[profile.release]
lto = "thin"
codegen-units = 1
